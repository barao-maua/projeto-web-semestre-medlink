{% load static %}

<footer class="bg-base-200 text-base-content">

  <!-- Grid de 3 colunas no desktop, 1 coluna no mobile -->
  <div class="max-w-5xl mx-auto px-6 py-12 grid grid-cols-1 md:grid-cols-3 gap-8">

    <!-- Coluna 1: Logo e descrição -->
    <!-- items-center md:items-start → centralizado no mobile, alinhado à esquerda no desktop -->
    <div class="flex flex-col items-center md:items-start text-center md:text-left">
      <!-- h-20 no mobile, h-28 no desktop → logo responsiva -->
      <img src="{% static 'images/logo-medlink.png' %}" alt="MedLink" class="h-20 md:h-28 w-auto mb-3">
      <p class="text-base-content/60 text-sm">
        Conectando pacientes e médicos de forma simples, rápida e organizada.
      </p>
    </div>

    <!-- Coluna 2: Links rápidos -->
    <div class="flex flex-col items-center md:items-start text-center md:text-left">
      <h3 class="font-bold text-lg mb-3">Links Rápidos</h3>
      <ul class="space-y-2 text-base-content/60 text-sm">
        <!-- hover:text-primary → muda de cor ao passar o mouse -->
        <!-- transition-colors → animação suave na troca de cor -->
        <li><a href="{% url 'index' %}" class="hover:text-primary transition-colors">Home</a></li>
        <li><a href="{% url 'sobre' %}" class="hover:text-primary transition-colors">Sobre</a></li>
        <li><a href="{% url 'especialidades' %}" class="hover:text-primary transition-colors">Especialidades</a></li>
      </ul>
    </div>

    <!-- Coluna 3: Contato -->
    <div class="flex flex-col items-center md:items-start text-center md:text-left">
      <h3 class="font-bold text-lg mb-3">Contato</h3>
      <ul class="space-y-2 text-base-content/60 text-sm">
        <!-- bi bi-envelope → ícone de email do Bootstrap Icons -->
        <li><i class="bi bi-envelope me-2"></i> contato@medlink.com</li>
        <li><i class="bi bi-telephone me-2"></i> (16) 99999-9999</li>
        <li><i class="bi bi-geo-alt me-2"></i> Ribeirão Preto, SP</li>
      </ul>
    </div>
  </div>

  <!-- Linha divisória e copyright -->
  <!-- border-t → linha no topo separando do conteúdo acima -->
  <div class="border-t border-base-300 py-4 text-center text-sm text-base-content/50">
    <p>© 2026 MedLink — Todos os direitos reservados</p>
  </div>
</footer>
