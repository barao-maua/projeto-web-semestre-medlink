{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MedLink</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.min.css"
          rel="stylesheet"
          type="text/css" />

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS do projeto -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    {% if extra_css %}
    <link rel="stylesheet" href="{% static extra_css %}">
    {% endif %}
</head>

<body class="min-h-screen flex flex-col bg-base-100">

    <c-header></c-header>

    <main class="flex-1">
        {{ slot }}
    </main>

    <c-footer></c-footer>

    {% if extra_js %}
    <script src="{% static extra_js %}"></script>
    {% endif %}

</body>
</html>
