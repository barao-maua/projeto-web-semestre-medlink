<c-layouts.base>
    <div class="hero min-h-[calc(100vh-80px)] bg-base-200">
        <div class="hero-content flex-col justify-center w-full max-w-md py-4">
            <div class="text-center lg:text-left">
                <h1 class="text-4xl font-bold text-primary">Acesse sua conta</h1>
                <p class="py-2">Faça login para gerenciar seus agendamentos.</p>
            </div>
            <div class="card shrink-0 w-full shadow-2xl bg-base-100">
                <form class="card-body p-6" method="post" action="{% url 'login' %}">
                    {% csrf_token %}

                    {% if form.non_field_errors %}
                    <div class="alert alert-error mb-3">
                        {{ form.non_field_errors }}
                    </div>
                    {% endif %}

                    {% for field in form %}
                    <div class="form-control mb-3">
                        <label class="label">
                            <span class="label-text font-semibold">{{ field.label }}</span>
                        </label>
                        {{ field }}
                        {% if field.errors %}
                        <label class="label">
                            <span class="label-text-alt text-error">{{ field.errors.0 }}</span>
                        </label>
                        {% endif %}
                    </div>
                    {% endfor %}

                    <div class="form-control mt-4">
                        <button type="submit" class="btn btn-primary">Entrar</button>
                    </div>

                    <div class="text-center mt-4">
                        <p class="text-sm">Não tem uma conta? <a href="{% url 'register' %}" class="link link-primary">Cadastre-se</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</c-layouts.base>
